name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Debug APK and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-android-build
      - name: Test release metadata validation
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Build debug APK and run unit tests
        run: >-
          bash ./gradlew :app:assembleDebug :app:testDebugUnitTest
          -Prikkahub.enableFirebase=false --no-daemon --stacktrace --console=plain
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rhplusesp-debug-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-tests-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7

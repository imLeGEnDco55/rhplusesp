name: Set up Android build
description: Toolchain for the Android, Chaquopy and embedded web modules
runs:
  using: composite
  steps:
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - name: Prepare Python build dependencies
      shell: bash
      run: python -m pip install --upgrade pip setuptools wheel
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        packages: platform-tools
    - name: Install Android SDK packages
      shell: bash
      run: sdkmanager 'platforms;android-37.0' 'platforms;android-36.1' 'build-tools;36.0.0'
    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      with:
        version: '10.30.3'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
    - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      with:
        # Only the default branch may save caches. Releases use a clean build.
        cache-read-only: ${{ github.event_name != 'push' || github.ref_name != github.event.repository.default_branch }}
        cache-disabled: ${{ startsWith(github.ref, 'refs/tags/') }}
    - name: Install embedded web dependencies
      shell: bash
      working-directory: web-ui
      run: pnpm install --frozen-lockfile
